name: Notify Downstream Private Repo

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/notify-downstream.yml'
  workflow_dispatch:

jobs:
  notify-kurocat-private:
    if: github.repository == 'Green-Coke/deskpet'
    runs-on: ubuntu-latest
    steps:
      - name: Check DOWNSTREAM_SYNC_PAT secret
        env:
          DOWNSTREAM_PAT: ${{ secrets.DOWNSTREAM_SYNC_PAT }}
        run: |
          if [ -z "$DOWNSTREAM_PAT" ]; then
            echo "::error::Missing repository secret DOWNSTREAM_SYNC_PAT in Green-Coke/deskpet."
            echo "Create a fine-grained PAT with Contents (Read and write) on Green-Coke/kurocat-private and save it as DOWNSTREAM_SYNC_PAT."
            exit 1
          fi

      - name: Dispatch upstream-sync event to Green-Coke/kurocat-private
        env:
          DOWNSTREAM_PAT: ${{ secrets.DOWNSTREAM_SYNC_PAT }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DOWNSTREAM_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Green-Coke/kurocat-private/dispatches \
            -d "{\"event_type\":\"upstream-sync\",\"client_payload\":{\"source_repo\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}}"
